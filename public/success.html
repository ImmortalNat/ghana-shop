<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Download Your PDF</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .download-card { background: #eef7f8; border: 2px solid #0a7e8c; border-radius: 10px; padding: 1.5rem; margin: 1.5rem 0; text-align: center; }
    .download-btn { display: inline-flex; align-items: center; gap: 0.5rem; background: #28a745; color: white; font-size: 1.15rem; font-weight: bold; padding: 1rem 2rem; border-radius: 8px; text-decoration: none; margin-top: 0.8rem; box-shadow: 0 4px 12px rgba(40,167,69,0.3); }
    .download-btn:hover { background: #218838; }
  </style>
</head>
<body>
  <nav class="navbar"><a href="/" class="navbar-brand">🛍️ Shop with <span>ease</span></a></nav>
  <div class="page-container" style="max-width: 600px; text-align: center; margin-top: 3rem;">
    <div style="background: #fff; padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
      <h1 style="font-size: 3rem; margin: 0;">🎉</h1>
      <h2 style="color: #28a745; margin: 0.5rem 0;">Payment Confirmed!</h2>
      <p id="statusMsg" style="color: #6c757d;">Unlocking your digital downloads...</p>

      <!-- DIRECT PDF EBOOK DOWNLOAD BOX -->
      <div id="downloadContainer" style="display: none;">
        <div class="download-card">
          <h3 style="color: #0a7e8c; margin-bottom: 0.3rem;">📖 Your PDF eBook is Unlocked!</h3>
          <p style="color: #495057; font-size: 0.95rem;">Click below to download the complete PDF file to your phone/computer:</p>
          <div id="downloadButtonsList"></div>
        </div>
      </div>

      <!-- Receipt Box -->
      <div id="txInfo" style="margin: 1.5rem 0; text-align: left; background: #f8f9fa; padding: 1.2rem; border-radius: 8px; font-size: 0.9rem; line-height: 1.6; border: 1px solid #e9ecef; display: none;"></div>

      <a id="waContact" href="#" target="_blank" class="btn" style="background:#25D366; display:block; text-align:center; text-decoration:none; margin-top:1rem; padding: 0.8rem;">
        💬 Have Questions? WhatsApp Support
      </a>

      <a href="/" class="btn" style="display:block; margin-top:0.8rem; background:#6c757d; text-decoration:none; padding:0.75rem;">
        Back to Store
      </a>
    </div>
  </div>

  <script>
    const ref = new URLSearchParams(window.location.search).get('reference') || new URLSearchParams(window.location.search).get('trxref');
    if (ref) {
      fetch('/api/orders/' + ref).then(r => r.json()).then(data => {
        if (data.success) {
          localStorage.removeItem('shopwave_cart');
          const o = data.order;
          document.getElementById('statusMsg').textContent = 'Thank you! Full access has been granted.';

          // Render Direct PDF Downloads
          if (o.downloads && o.downloads.length > 0) {
            document.getElementById('downloadContainer').style.display = 'block';
            document.getElementById('downloadButtonsList').innerHTML = o.downloads.map(d =>
              `<div style="margin-top: 1rem;">
                <strong style="display:block; font-size:1.05rem; color:#1a1a2e; margin-bottom:0.4rem;">${d.name}</strong>
                <a href="${d.downloadUrl}" class="download-btn">📥 Download Complete PDF</a>
              </div>`
            ).join('');
          }

          document.getElementById('txInfo').style.display = 'block';
          document.getElementById('txInfo').innerHTML = `
            <strong>Order Reference:</strong> ${o.reference}<br>
            <strong>Amount:</strong> GH₵${Number(o.amount).toFixed(2)}<br>
            <strong>Customer:</strong> ${o.customerEmail}<br>
            <strong>Items:</strong> ${o.items}
          `;

          document.getElementById('waContact').href = `https://wa.me/233536473017?text=${encodeURIComponent('Hello, I bought: ' + o.reference)}`;
        }
      });
    }
  </script>
</body>
</html>
