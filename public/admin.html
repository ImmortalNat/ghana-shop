<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Shop with ease</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .tab-bar{display:flex;gap:0.5rem;border-bottom:2px solid var(--gray-200);margin-bottom:1.5rem;}
    .tab-btn{padding:0.8rem 1.2rem;background:none;border:none;font-weight:bold;color:var(--gray-500);cursor:pointer;}
    .tab-btn.active{color:var(--primary);border-bottom:3px solid var(--primary);}
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.2rem;}
    .admin-card{background:#fff;padding:1.2rem;border-radius:8px;box-shadow:var(--shadow);}
    .order-card{background:#fff;border-radius:10px;padding:1.2rem;margin-bottom:1rem;box-shadow:var(--shadow);border-left:5px solid var(--success);}
    .momo-direct-highlight { border-left-color: #f59e0b !important; background: #fffdf9 !important; }
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:1000;}
    .modal-content{background:#fff;padding:2rem;border-radius:var(--radius);max-width:480px;width:90%;}
  </style>
</head>
<body>
  <nav class="navbar"><a href="/" class="navbar-brand">🛡️ Admin <span>Store Manager</span></a><ul class="navbar-links"><li><a href="/" target="_blank">View Store</a></li></ul></nav>
  <div class="page-container">
    <div id="loginBox" style="max-width:360px;margin:4rem auto;background:#fff;padding:2rem;border-radius:var(--radius);text-align:center;box-shadow:var(--shadow);">
      <h3>🔐 Admin Login</h3>
      <input type="password" id="adminPass" placeholder="Password" style="width:100%;padding:0.8rem;margin:1rem 0;border:1.5px solid var(--gray-300);border-radius:6px;">
      <button class="btn" onclick="init()">Unlock Dashboard</button>
    </div>
    
    <div id="dash" style="display:none;">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="tab('orders',this)">📦 Customer Sales</button>
        <button class="tab-btn" onclick="tab('books',this)">📚 Manage eBooks</button>
      </div>

      <!-- SALES TAB (Handles Direct MoMo Approvals) -->
      <div id="ordersTab">
        <div style="display:flex;justify-content:space-between;margin-bottom:1.5rem;align-items:center;">
          <h3>Customer Sales & MoMo Verifications</h3>
          <button class="btn" style="width:auto;padding:0.5rem 1rem;background:#6c757d;" onclick="loadOrders()">🔄 Refresh</button>
        </div>
        <div id="ordersList">Loading...</div>
      </div>

      <!-- BOOKS TAB -->
      <div id="booksTab" style="display:none;">
        <div style="display:flex;justify-content:space-between;margin-bottom:1.5rem;align-items:center;">
          <h3>eBook Catalog</h3>
          <button class="btn" style="background:var(--success);" onclick="openModal()">➕ Add Book</button>
        </div>
        <div class="products-grid" id="bList" style="padding:0;"></div>
      </div>
    </div>
  </div>

  <!-- Book Modal -->
  <div class="modal" id="m"><div class="modal-content">
    <h3>Upload Book</h3>
    <form onsubmit="save(event)">
      <input type="hidden" id="bid"><input type="hidden" id="bimgB64">
      <div class="form-group"><label>Book Title *</label><input type="text" id="bname" required></div>
      <div class="form-group"><label>Author</label><input type="text" id="bauthor"></div>
      <div class="form-group"><label>Price GH₵ *</label><input type="number" step="0.01" id="bprice" required></div>
      <div class="form-group"><label>Preview PDF Link (Free sample pages) *</label><input type="url" id="bpreview" required></div>
      <div class="form-group"><label>Full PDF Download Link (Protected - Paid) *</label><input type="url" id="bdownload" required></div>
      <div class="form-group"><label>Cover Image (Direct File / Photo) *</label><input type="file" accept="image/*" onchange="handleImg(event)" style="width:100%; padding:0.5rem; border:1px dashed #0a7e8c; border-radius:6px;"><img id="bookPrev" src="" style="display:none; width:90px; height:120px; object-fit:cover; border-radius:6px; margin-top:0.5rem;"></div>
      <div style="display:flex;gap:0.5rem;margin-top:1rem;"><button type="submit" class="btn" style="background:var(--success);">Save Book</button><button type="button" class="btn" style="background:#666;" onclick="closeModal()">Cancel</button></div>
    </form>
  </div></div>

  <script>
    let P='';
    function tab(t,b){document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('ordersTab').style.display=t==='orders'?'block':'none';document.getElementById('booksTab').style.display=t==='books'?'block':'none';if(t==='books')loadB();if(t==='orders')loadOrders();}
    
    async function init(){
      P=document.getElementById('adminPass').value;
      const r=await fetch('/api/admin/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:P})});
      const d=await r.json();
      if(!d.success)return alert('Wrong password');
      document.getElementById('loginBox').style.display='none';
      document.getElementById('dash').style.display='block';
      loadOrders();
    }

    async function loadOrders() {
      const r=await fetch('/api/admin/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:P})});
      const d=await r.json(); const box=document.getElementById('ordersList');
      if(!d.orders.length) return box.innerHTML='<p style="color:#6c757d; padding:2rem; text-align:center;">No sales yet.</p>';
      
      box.innerHTML=d.orders.map(o=>`
        <div class="order-card ${o.status === 'Awaiting MoMo Verification' ? 'momo-direct-highlight' : ''}">
          <div style="display:flex;justify-content:space-between;">
            <strong>Ref: ${o.reference}</strong>
            <strong style="color:var(--success); font-size:1.15rem;">GH₵${Number(o.amount).toFixed(2)}</strong>
          </div>
          <div style="background:#f8f9fa; padding:0.8rem; margin:0.8rem 0; border-radius:6px; font-size:0.9rem; line-height:1.6;">
            👤 <b>Customer:</b> ${o.customerName} (${o.customerEmail})<br>
            📞 <b>Phone / MoMo:</b> <a href="https://wa.me/233${(o.phone||'').replace(/^0/,'')}" target="_blank" style="color:#25D366; font-weight:bold;">💬 WhatsApp ${o.phone}</a><br>
            📖 <b>Book(s):</b> ${o.items}<br>
            ⚠️ <b>Payment Type:</b> ${o.isDirectMomo ? '<strong style="color:#b7791f;">DIRECT MOMO TRANSFER</strong>' : '<strong style="color:#0a7e8c;">AUTOMATED PAYSTACK</strong>'}
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
            <div>
              <label><b>Set Status:</b></label>
              <select class="status-select" style="padding:0.4rem; font-weight:bold;" onchange="updateSt('${o.reference}',this.value)">
                <option value="Awaiting MoMo Verification" ${o.status==='Awaiting MoMo Verification'?'selected':''}>🟡 Awaiting MoMo Verification</option>
                <option value="Delivered" ${o.status==='Delivered'?'selected':''}>🟢 Verified (Paid & Unlock Download)</option>
              </select>
            </div>
            <span style="font-weight:bold; color:${o.status==='Delivered'?'var(--success)':'#b7791f'};">Current: ${o.status}</span>
          </div>
        </div>
      `).join('');
    }

    async function updateSt(ref,st) {
      await fetch('/api/admin/update-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:P,reference:ref,status:st})});
      loadOrders();
    }

    async function loadB(){
      const ps=await(await fetch('/api/products')).json();
      document.getElementById('bList').innerHTML=ps.map(p=>'<div class="admin-card"><img src="'+p.image+'" style="width:100%;height:180px;object-fit:cover;border-radius:6px;"><h4>'+p.name+'</h4><strong style="color:var(--primary);">GH₵'+Number(p.price).toFixed(2)+'</strong><br><button class="btn" style="padding:0.4rem;background:var(--accent);margin-top:0.5rem;" onclick="del('+p.id+')">Delete</button></div>').join('');
    }

    function openModal(){document.getElementById('bid').value='';document.getElementById('bname').value='';document.getElementById('bprice').value='';document.getElementById('bpreview').value='';document.getElementById('bdownload').value='';document.getElementById('bookPrev').style.display='none';document.getElementById('m').style.display='flex';}
    function closeModal(){document.getElementById('m').style.display='none';}

    function compressImg(file, cb) {
      const r = new FileReader();
      r.onload = e => { const i = new Image(); i.onload = () => { const c = document.createElement('canvas'); let w=i.width, h=i.height; if(w>h){if(w>600){h*=600/w;w=600;}}else{if(h>600){w*=600/h;h=600;}} c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);cb(c.toDataURL('image/jpeg',0.8)); }; i.src=e.target.result; }; r.readAsDataURL(file);
    }
    function handleImg(e) { const f=e.target.files[0]; if(!f)return; compressImg(f,b=>{document.getElementById('bookImgB64').value=b;const p=document.getElementById('bookPrev');p.src=b;p.style.display='block';}); }

    async function save(e){
      e.preventDefault(); const img=document.getElementById('bookImgB64').value; if(!img) return alert('Select book cover photo');
      await fetch('/api/admin/products/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:P,product:{id:document.getElementById('bid').value,name:document.getElementById('bname').value,author:document.getElementById('bauthor').value,price:document.getElementById('bprice').value,previewUrl:document.getElementById('bpreview').value,downloadUrl:document.getElementById('bdownload').value,image:img}})});
      closeModal(); loadB();
    }
    async function del(id){if(!confirm('Delete?'))return;await fetch('/api/admin/products/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:P,productId:id})});loadB();}
  </script>
</body>
</html>
