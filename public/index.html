<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopWave Ghana - Online Store</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">🛍️ Shop<span>Wave</span></a>
    <ul class="navbar-links">
      <li><a href="/">Home</a></li>
      <li><a href="/cart" class="cart-icon">🛒 <span class="cart-count" id="cartCount">0</span></a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1>Welcome to ShopWave Ghana</h1>
    <p>Pay easily with Mobile Money (MTN, Vodafone, AirtelTigo) or Bank Cards via Paystack.</p>
  </header>

  <div class="filter-section">
    <button class="filter-btn active" onclick="filterCat('all', this)">All</button>
    <button class="filter-btn" onclick="filterCat('Electronics', this)">Electronics</button>
    <button class="filter-btn" onclick="filterCat('Fashion', this)">Fashion</button>
    <button class="filter-btn" onclick="filterCat('Home', this)">Home</button>
  </div>

  <main class="products-grid" id="productsGrid"></main>
  <div class="toast" id="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
