<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopWave</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">🛍️ Shop<span>Wave</span></a>
    <ul class="navbar-links"><li><a href="/cart">← Back to Cart</a></li></ul>
  </nav>

  <div class="page-container">
    <div class="checkout-layout">
      <form class="checkout-form" id="checkoutForm">
        <h3>Customer Details</h3>
        <div class="form-group" style="margin-top:1rem;">
          <label>Full Name *</label>
          <input type="text" id="name" required placeholder="Kwame Mensah">
        </div>
        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" id="email" required placeholder="kwame@example.com">
        </div>
        <div class="form-group">
          <label>Phone Number (MoMo / WhatsApp) *</label>
          <input type="tel" id="phone" required placeholder="0244123456">
        </div>
        <div class="form-group">
          <label>Delivery Address *</label>
          <input type="text" id="address" required placeholder="East Legon, Accra">
        </div>
        <button type="submit" class="btn" id="payBtn" style="background:var(--secondary); font-size:1rem;">
          Pay with Paystack (MoMo / Card) 💳
        </button>
      </form>
      <div class="cart-summary" id="orderSummary"></div>
    </div>
  </div>
  <script src="/js/checkout.js"></script>
</body>
</html>
